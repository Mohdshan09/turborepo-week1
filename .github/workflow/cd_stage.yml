name: Deploy to staging
on:
  push:
    branches:
      - main

jobs:
  redeploy_everything:
    name: Redeploy everything

    steps:
      - name: SSH into server and redeploy everything
      - run: |
          echo ${{secrets.SSH_PK}} &> ~/ssh_key
          ssh -i ~/ssh_key ubuntu@13.201.85.67
          cd turborepo-week1/ && git pull
          pnpm install
          pnpm build
          pm2 restart ws-server
          pm2 restart web
          pm2 restart http

